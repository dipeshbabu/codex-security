name: PR review validation
'on':
  push:
    branches:
    - ci/validate-codex-review-20260919
permissions:
  contents: read
  actions: read
concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
    - name: Download verified upstream native runtime
      env:
        GH_TOKEN: ${{ github.token }}
        GODEBUG: http2client=0
      run: gh run download 35372177490 --repo openai/codex-security --name native-universal-b998318dade16cc64f33bb98043d9a1c6d2a40d1
        --dir native-base
    - uses: actions/upload-artifact@v4
      with:
        name: native-base
        path: native-base
        retention-days: 3
  windows:
    needs: native
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
        - commit: 14a3b7b61673c25fae68341925ad613025cfad3d
          shard: 1
        - commit: 14a3b7b61673c25fae68341925ad613025cfad3d
          shard: 2
        - commit: 14a3b7b61673c25fae68341925ad613025cfad3d
          shard: 3
        - commit: 14a3b7b61673c25fae68341925ad613025cfad3d
          shard: 4
        - commit: 14a3b7b61673c25fae68341925ad613025cfad3d
          shard: 5
        - commit: 14a3b7b61673c25fae68341925ad613025cfad3d
          shard: 6
        - commit: 14a3b7b61673c25fae68341925ad613025cfad3d
          shard: 7
    steps:
    - &id001
      uses: actions/checkout@v4
      with:
        ref: ${{ matrix.commit }}
        persist-credentials: false
    - &id002
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      with:
        run_install: false
    - &id003
      uses: actions/setup-node@v4
      with:
        node-version: 22.13.0
        cache: pnpm
        cache-dependency-path: sdk/typescript/pnpm-lock.yaml
    - &id004
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    - &id005
      run: pnpm --dir sdk/typescript install --frozen-lockfile
    - &id006
      run: pnpm --dir plugins/codex-security/mcp-app install --frozen-lockfile
    - &id007
      uses: actions/download-artifact@v4
      with:
        name: native-base
        path: plugins/codex-security/native/prebuilt
    - &id008
      run: node sdk/typescript/scripts/build-plugin.mjs
    - &id009
      name: Private Windows test root
      if: runner.os == 'Windows'
      id: private
      shell: pwsh
      run: ./sdk/typescript/scripts/prepare-windows-test-root.ps1
    - name: Windows CI shard
      env:
        TEMP: ${{ steps.private.outputs.path }}
        TMP: ${{ steps.private.outputs.path }}
        TMPDIR: ${{ steps.private.outputs.path }}
        CODEX_SECURITY_ALLOW_MACHINE_POLICY_TEST: 'false'
      run: node sdk/typescript/scripts/run-ci-tests.mjs ${{ matrix.shard }}/7 --seed 12345
  paths:
    needs: native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          commit: 6a1268a5ff2190dd384cf3845dbf8bbfe4bc4bcc
        - os: ubuntu-24.04
          commit: 6a1268a5ff2190dd384cf3845dbf8bbfe4bc4bcc
        - os: macos-latest
          commit: 6a1268a5ff2190dd384cf3845dbf8bbfe4bc4bcc
    steps:
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
    - *id008
    - *id009
    - name: Path regression suite
      working-directory: sdk/typescript
      env:
        TEMP: ${{ steps.private.outputs.path || runner.temp }}
        TMP: ${{ steps.private.outputs.path || runner.temp }}
        TMPDIR: ${{ steps.private.outputs.path || runner.temp }}
      run: bun test --timeout 120000 ./tests-ts/workbench-canonical-paths.test.ts
    - run: pnpm --dir sdk/typescript run types
    - run: pnpm --dir sdk/typescript run format
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        commit:
        - 14a3b7b61673c25fae68341925ad613025cfad3d
    steps:
    - *id001
    - *id002
    - *id003
    - *id004
    - *id005
    - *id006
    - run: pnpm --dir sdk/typescript run types
    - run: pnpm --dir sdk/typescript run format
  versions:
    needs: native
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-latest
          commit: d76f9646f82c3dd16362eda6ebafaa0e94f0c07f
        - os: ubuntu-24.04
          commit: d76f9646f82c3dd16362eda6ebafaa0e94f0c07f
        - os: macos-latest
          commit: d76f9646f82c3dd16362eda6ebafaa0e94f0c07f
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ matrix.commit }}
        persist-credentials: false
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      with:
        run_install: false
    - uses: actions/setup-node@v4
      with:
        node-version: 22.13.0
        cache: pnpm
        cache-dependency-path: sdk/typescript/pnpm-lock.yaml
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    - run: pnpm --dir sdk/typescript install --frozen-lockfile
    - run: pnpm --dir plugins/codex-security/mcp-app install --frozen-lockfile
    - uses: actions/download-artifact@v4
      with:
        name: native-base
        path: plugins/codex-security/native/prebuilt
    - run: node sdk/typescript/scripts/build-plugin.mjs
    - name: Private Windows test root
      if: runner.os == 'Windows'
      id: private
      shell: pwsh
      run: ./sdk/typescript/scripts/prepare-windows-test-root.ps1
    - name: Version comparison regression suite
      working-directory: sdk/typescript
      env:
        TEMP: ${{ steps.private.outputs.path || runner.temp }}
        TMP: ${{ steps.private.outputs.path || runner.temp }}
        TMPDIR: ${{ steps.private.outputs.path || runner.temp }}
      run: bun test --timeout 120000 ./tests-ts/update-notice.test.ts
    - run: pnpm --dir sdk/typescript run types
    - run: pnpm --dir sdk/typescript run format
